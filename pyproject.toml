[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "readback"
version = "0.1.0"
description = "LangGraph agent that proof-listens TTS audio: synthesize, transcribe back, compare, escalate."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Christian Schäfer" }]
dependencies = [
  "langgraph>=1.2,<2",
  "langchain>=1.4,<2",
  "langchain-anthropic>=1.7,<2",
  "langchain-mcp-adapters>=0.3.2,<0.4",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  # langchain-mcp-adapters does not support the mcp 2.x API yet.
  "mcp>=1.24,<2",
  "fastapi>=0.140",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "jiwer>=4.0",
  "num2words>=0.5.14",
  "pyyaml>=6.0",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
# av>=16 removed an argument faster-whisper 1.2 still passes to av.open().
local = ["piper-tts>=1.3", "faster-whisper>=1.1", "av>=14,<16"]
openai = ["openai>=1.60", "langchain-openai>=1.0"]
postgres = ["langgraph-checkpoint-postgres>=3.0", "psycopg[binary,pool]>=3.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]

[project.scripts]
readback = "readback.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/readback"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # German/typographic characters are intended
  "SIM108",  # if/else blocks are often clearer than ternaries
]

[tool.mypy]
python_version = "3.11"
packages = ["readback"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
