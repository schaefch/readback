apiVersion: v1
kind: ConfigMap
metadata:
  name: readback-config
data:
  READBACK_TTS_PROVIDER: openai
  READBACK_STT_PROVIDER: openai
  READBACK_REVIEWER: cascade
  READBACK_LLM_MODEL: anthropic:claude-opus-5-5
  READBACK_LLM_EFFORT: low
  READBACK_MAX_CONCURRENCY: "8"
  READBACK_LOG_LEVEL: INFO
  AZURE_OPENAI_ENDPOINT: https://my-openai.openai.azure.com
  OPENAI_API_VERSION: 2025-04-01-preview
