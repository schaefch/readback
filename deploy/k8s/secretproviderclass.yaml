apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: readback-kv
spec:
  provider: azure
  parameters:
    clientID: "00000000-0000-0000-0000-000000000000"
    keyvaultName: kv-readback
    tenantId: "00000000-0000-0000-0000-000000000000"
    objects: |
      array:
        - |
          objectName: readback-checkpointer-url
          objectType: secret
        - |
          objectName: anthropic-api-key
          objectType: secret
  secretObjects:
    - secretName: readback-secrets
      type: Opaque
      data:
        - { objectName: readback-checkpointer-url, key: READBACK_CHECKPOINTER }
        - { objectName: anthropic-api-key, key: ANTHROPIC_API_KEY }
