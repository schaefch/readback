apiVersion: apps/v1
kind: Deployment
metadata:
  name: readback
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: readback }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: readback
        azure.workload.identity/use: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics/
    spec:
      serviceAccountName: readback
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: readback
          ports: [{ name: http, containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: readback-config }
            - secretRef: { name: readback-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
            - { name: secrets, mountPath: /mnt/secrets, readOnly: true }
      volumes:
        # Audio takes are scratch data here; persist them to Azure Files/Blob if
        # reviewers need to listen from another pod.
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: readback-kv }
