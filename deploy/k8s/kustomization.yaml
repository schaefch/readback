# AKS deployment. Secrets come from Azure Key Vault via the Secrets Store CSI driver
# and the pod authenticates with Azure Workload Identity (no static credentials).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: readback
labels:
  - pairs: { app.kubernetes.io/part-of: readback }
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
images:
  - name: readback
    newName: myregistry.azurecr.io/readback
    newTag: "0.1.0"
